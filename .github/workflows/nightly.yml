name: Nightly — npm (nightly)

# Manual: run it from the branch to publish (develop, or main). The version
# exists only in this workspace: nothing is committed back.
on:
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish nightly to npm
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC token for npm Trusted Publishing: no long-lived npm token is used.
      id-token: write
    steps:
      - name: Only develop and main may be published
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$REF_NAME" in
            develop | main) ;;
            *) echo "::error::Run this workflow from develop or main, not '${REF_NAME}'."; exit 1 ;;
          esac

      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # Trusted Publishing needs npm >= 11.5.1, which Node 24 ships.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A nightly of an already released version would sort before it
      # (0.1.0-nightly < 0.1.0): it is numbered after the next patch instead.
      - name: Compute the nightly version
        id: version
        run: |
          name=$(node -p "require('./package.json').name")
          base=$(node -p "require('./package.json').version.split('-')[0]")
          if npm view "${name}@${base}" version >/dev/null 2>&1; then
            base=$(node -p "const [a,b,c]='${base}'.split('.').map(Number); [a,b,c+1].join('.')")
          fi
          nightly="${base}-nightly.$(date -u +%Y%m%d).g$(git rev-parse --short=7 HEAD)"
          npm version "$nightly" --no-git-tag-version
          echo "value=$nightly" >> "$GITHUB_OUTPUT"

      - name: Build
        run: pnpm build

      - name: Publish with the nightly dist-tag
        run: npm publish --tag nightly --access public
