name: Nightly — npm (nightly)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to publish from"
        required: true
        default: "develop"
        type: string

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish nightly to npm
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PACKAGE: "@circle-rd/auth-ai"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The nightly version exists only in this workspace: nothing is committed
      # back, so no version-bump commit lands on the branch.
      - name: Compute nightly version
        id: version
        run: |
          base=$(node -p "require('./package.json').version.split('-')[0]")
          nightly="${base}-nightly.$(date -u +%Y%m%d).g$(git rev-parse --short=7 HEAD)"
          npm version "$nightly" --no-git-tag-version
          echo "value=$nightly" >> "$GITHUB_OUTPUT"

      - name: Build
        run: pnpm build

      - name: Find the nightly being superseded
        id: previous
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          previous=$(npm view "$PACKAGE" dist-tags.nightly 2>/dev/null || true)
          echo "value=$previous" >> "$GITHUB_OUTPUT"

      - name: Publish with the nightly dist-tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --tag nightly --access public --provenance

      # npm cannot delete a version once published, but a deprecated one is
      # flagged and no dist-tag points at it. The registry holds no GitHub
      # release: none is created for a nightly.
      - name: Deprecate the superseded nightly
        if: steps.previous.outputs.value != '' && steps.previous.outputs.value != steps.version.outputs.value
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm deprecate "${PACKAGE}@${{ steps.previous.outputs.value }}" "Superseded nightly build"
